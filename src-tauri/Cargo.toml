[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
fs_extra = "1.3"
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "macros", "rt-multi-thread"] }
tokio-tungstenite = "0.27"
futures-util = "0.3"
local-ip-address = "0.6.13"
tauri-plugin-single-instance = "2.4.4"
yrs = { version = "0.27.4", features = ["sync"] }
urlencoding = "2.1.3"
# OpenAI互換API (HTTP/HTTPS) への直接呼び出し用 (AI呼び出しの api モード)
ureq = { version = "2", features = ["json"] }
# API URL の厳密な検証用 (ureq と同じパーサで設定時に検証する)
url = "2"

# 起動時間と配布サイズの改善 (軽量 LTO + 単一コード生成単位 + デバッグ情報削除)
[profile.release]
lto = "thin"
codegen-units = 1
strip = true

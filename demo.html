<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>MDNotepad 開発版プレビュー</title>
<style>
body { font-family: 'Segoe UI', sans-serif; margin: 20px; }
.app-header { display:flex; justify-content:space-between; padding:8px; background:#f0f0f0; border-bottom:1px solid #ddd; }
.toolbar { display:flex; gap:4px; padding:8px; background:#f5f5f5; border-bottom:1px solid #ddd; }
.btn { padding:6px 12px; border:1px solid #ccc; background:white; border-radius:4px; cursor:pointer; }
.toolbar-button { padding:6px 12px; border:1px solid #ccc; background:white; border-radius:4px; cursor:pointer; }
.editor { min-height:400px; padding:16px; font-size:14px; line-height:1.6; border:1px solid #ddd; }
</style>
</head>
<body>
<div class="app-header">
  <h1>MDNotepad - 無題</h1>
  <div>
    <button class="btn">新規作成</button>
    <button class="btn">開く</button>
    <button class="btn">保存</button>
    <button class="btn">共同編集</button>
  </div>
</div>

<div class="toolbar">
  <button class="toolbar-button" title="大見出しを挿入します">H1</button>
  <button class="toolbar-button" title="中見出しを挿入します">H2</button>
  <button class="toolbar-button" title="太字にします">B</button>
  <button class="toolbar-button" title="斜体にします">I</button>
  <button class="toolbar-button" title="箇条書きを作成します">•</button>
  <button class="toolbar-button" title="引用を作成します">❝</button>
  <button class="toolbar-button" title="コードブロックを挿入します"></></button>
  <button class="toolbar-button" title="リンクを挿入します">🔗</button>
</div>

<div class="editor">
<h1>MDNotepad 開発版プレビュー</h1>
<p>ProseMirror エディタが実装予定です。</p>
<ul>
<li>Tauri + ProseMirror + Yjs</li>
<li>Windows専用・ポータブル配布</li>
<li>リアルタイム共同編集対応</li>
</ul>
</div>

<script>
// 開発サーバー起動確認
console.log('MDNotepad デモページ - Vite開発サーバーの起動を確認してください');
</script>
</body>
</html>

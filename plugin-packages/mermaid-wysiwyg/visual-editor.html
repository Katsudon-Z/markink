<!doctype html><html lang="ja"><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;height:100vh;display:flex;flex-direction:column;overflow:hidden;font:13px 'Segoe UI',Meiryo,sans-serif;color:#1e293b;background:#f1f5f9}
button,select,input,textarea{font:inherit}button,select{padding:6px 9px;border:1px solid #cbd5e1;background:white;border-radius:4px}button{cursor:pointer}button:hover{background:#e8f0ff}button:disabled{opacity:.5;cursor:default}button[aria-pressed=true],#save{background:#2563eb;color:white}#bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px;background:white;border-bottom:1px solid #cbd5e1;flex:none}#status{padding:5px 10px;color:#475569;background:white;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
#workspace{display:flex;flex:1;min-height:0}#source-pane{width:32%;min-width:0;display:flex;flex-direction:column}#source-pane[hidden],#splitter[hidden]{display:none}#source-pane label{padding:7px 12px;background:#e2e8f0}#source{flex:1;min-height:0;width:100%;border:0;resize:none;padding:12px;font:13px/1.5 Consolas,monospace;outline:none}#splitter{width:7px;background:#cbd5e1;cursor:col-resize;touch-action:none;flex:none}#splitter:hover,#splitter:focus-visible{background:#2563eb}#diagram{flex:1;min-width:0;min-height:0;background:white;--mw-chrome-bg:#fff;--mw-chrome-fg:#334155;--mw-chrome-hover:#e8f0ff;--mw-editor-bg:#fff}
#properties{width:230px;flex:none;padding:12px;overflow:auto;background:#f8fafc;border-left:1px solid #cbd5e1}#properties h3{margin:0 0 10px}#properties label{display:block;margin:10px 0 5px}#properties input,#properties select,#properties textarea{display:block;width:100%;padding:6px;border:1px solid #cbd5e1;border-radius:4px}#properties textarea{min-height:65px;resize:vertical}#properties button{margin-top:8px}#properties .row{display:flex;gap:6px}#properties input[type=color]{height:32px;padding:2px}#hint{color:#64748b;line-height:1.6}#selected-title{overflow-wrap:anywhere}#error{display:none;margin:0;padding:8px 12px;background:#fff1f2;color:#b91c1c;white-space:pre-wrap;overflow-wrap:anywhere;max-height:90px;overflow:auto;flex:none}
#copy-surface{position:fixed;left:-100000px;top:0;pointer-events:none}#copy-menu{font-size:13px}
%%COPY_STYLE%%
@media(max-width:700px){#properties{width:185px}#bar{gap:4px;padding:5px}button,select{padding:5px}}
</style>
<div id="bar"><strong>Mermaid ビジュアル</strong><button id="select-tool" aria-pressed="true">選択</button><button id="connect-tool" aria-pressed="false" title="ノードから別のノードへドラッグ">接続</button><select id="add-shape" aria-label="追加するノードの形状"></select><button id="add">ノード追加</button><select id="direction" aria-label="図の向き"><option value="TD">上から下</option><option value="LR">左から右</option><option value="BT">下から上</option><option value="RL">右から左</option></select><button id="undo" disabled>元に戻す</button><button id="redo" disabled>やり直す</button><button id="toggle-source" aria-pressed="false">記法を表示</button><span style="flex:1"></span><button id="save" disabled>文書に反映</button></div>
<div id="status" role="status">編集ライブラリを読み込み中…</div><div id="error" role="alert"></div>
<div id="workspace"><section id="source-pane" hidden><label for="source">Mermaid記法</label><textarea id="source" spellcheck="false" maxlength="100000"></textarea></section><div id="splitter" hidden role="separator" tabindex="0" aria-orientation="vertical" aria-label="記法欄の幅" aria-valuemin="15" aria-valuemax="65" aria-valuenow="32"></div><div id="diagram" aria-label="Mermaid図を編集"></div><aside id="properties"><h3>選択した要素</h3><div id="hint">ノードや矢印をクリックして編集します。文字はダブルクリックでも変更できます。「接続」でノード間をドラッグすると矢印を追加します。</div><div id="fields" hidden><div id="selected-title"></div><label for="label">文字</label><textarea id="label"></textarea><section id="node-fields"><label for="shape">形状</label><select id="shape"></select><label for="fill">塗り</label><input type="color" id="fill" value="#ececff"><label for="stroke">枠線</label><input type="color" id="stroke" value="#9370db"><label for="text-color">文字色</label><input type="color" id="text-color" value="#333333"><button id="reset-colors">色を既定に戻す</button><button id="duplicate">複製</button></section><section id="edge-fields"><label for="line">線種</label><select id="line"><option value="solid">実線</option><option value="dotted">点線</option><option value="thick">太線</option><option value="invisible">非表示の線</option></select><label for="arrow">終端</label><select id="arrow"><option value="arrow">矢印</option><option value="none">なし</option><option value="cross">×</option><option value="circle">丸</option></select><button id="reverse">向きを反転</button></section><button id="delete">削除</button></div><section id="new-edge"><h3 style="margin-top:20px">接続を追加</h3><label for="from">接続元</label><select id="from"></select><label for="to">接続先</label><select id="to"></select><button id="connect">矢印を追加</button></section></aside></div>
<div id="copy-surface"></div><div id="copy-menu"><button data-format="text">マークダウンコピー</button><button data-format="powerpoint">書式付きコピー</button><button data-format="png">PNG画像コピー</button></div>
%%SCRIPT%%
</html>
